<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🐼 Chengdu Cards — Batch 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#ddd6c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Caveat','Noto Sans Thai',sans-serif;padding:16px}
    .app-header{text-align:center;margin-bottom:10px}
    .app-title{font-size:22px;color:#444;font-family:'Caveat',sans-serif}
    .month-badge{display:inline-block;padding:3px 16px;border-radius:20px;font-size:13px;font-family:'Noto Sans Thai',sans-serif;margin-top:4px;color:#fff}

    /* Progress bar */
    .prog-wrap{width:100%;max-width:460px;margin-bottom:12px}
    .prog-bar-bg{background:#c5bdb2;border-radius:20px;height:8px;width:100%;overflow:hidden}
    .prog-bar-fill{background:#555;border-radius:20px;height:8px;transition:width 0.35s ease}
    .prog-text{text-align:center;font-size:13px;color:#666;margin-top:4px;font-family:'Noto Sans Thai',sans-serif}

    /* CARD */
    .card{background:#f5f0e6;border-radius:28px;padding:24px 20px 20px;box-shadow:5px 8px 24px rgba(0,0,0,.15);width:100%;max-width:460px;min-height:540px;position:relative}

    /* --- HEADER --- */
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
    .word-section{flex:1;text-align:center}
    .cat-badge{display:inline-block;background:#444;color:#f5f0e6;font-size:11px;padding:2px 12px;border-radius:20px;margin-bottom:6px;font-family:'Noto Sans Thai',sans-serif}
    .blob-wrap{position:relative;display:inline-block;padding:6px 16px 10px;margin-bottom:2px}
    .blob-wrap::before{content:'';position:absolute;inset:0;background:var(--bc,#7ECFC0);border-radius:58% 62% 55% 68%/60% 55% 65% 58%;z-index:0}
    .zh-main{font-family:'Noto Sans SC',sans-serif;font-size:54px;font-weight:900;color:#1a1a1a;position:relative;z-index:1;line-height:1.05;letter-spacing:4px}
    .py-main{font-size:17px;color:#555;margin-top:4px;font-family:'Caveat',sans-serif;letter-spacing:1px}
    .th-main{font-size:20px;font-weight:700;color:#222;margin-top:2px;font-family:'Noto Sans Thai',sans-serif}
    .emoji-box{font-size:52px;line-height:1;padding-left:8px;padding-top:4px;flex-shrink:0}

    hr{border:none;border-top:1.5px solid #ccc;margin:10px 0}

    /* Section label */
    .sec-label{font-size:18px;font-weight:700;color:#1a1a1a;font-family:'Caveat',sans-serif;display:inline-block;border-bottom:2.5px wavy #888;padding-bottom:1px;margin-bottom:10px}

    /* Radicals */
    .rad-row{display:flex;align-items:flex-start;margin-bottom:9px;font-size:14.5px;line-height:1.55;color:#2a2a2a}
    .rad-row::before{content:'– ';flex-shrink:0;margin-top:1px}
    .hl{display:inline-block;padding:0 10px 1px;border-radius:50px;font-family:'Noto Sans SC',sans-serif;font-weight:700;font-size:18px;vertical-align:middle;margin-right:2px}
    .ho{background:#FFD580}.hg{background:#A8E6C8}.hb{background:#B3D8FF}.hp{background:#FFB8C6}
    .sub{display:block;margin-left:20px;font-size:13px;color:#666;line-height:1.4;margin-top:2px}
    .sub::before{content:'↳ '}

    /* Trick */
    .trick{background:#FFD580;border-radius:14px;padding:10px 14px;margin:10px 0 8px;font-size:14.5px;line-height:1.55;color:#1a1a1a}
    .tl{font-weight:700;font-size:16px;font-family:'Caveat',sans-serif}

    /* Extra tip */
    .extra{background:#e8f4fd;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:#2a5f8f;line-height:1.5}
    .extra::before{content:'📌 '}

    /* Examples */
    .ex-item{margin-bottom:10px;font-size:14.5px;line-height:1.5}
    .ex-item::before{content:'– '}
    .zh-s{font-family:'Noto Sans SC',sans-serif;font-weight:700;font-size:16px;color:#1a1a1a}
    .py-s{display:block;margin-left:12px;font-size:12px;color:#777}
    .th-s{display:block;margin-left:12px;font-size:13.5px;color:#c0392b;font-family:'Noto Sans Thai',sans-serif}

    /* Nav */
    .nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;width:100%;max-width:460px;gap:10px}
    .nav-btn{background:#f5f0e6;border:2.5px solid #333;border-radius:50px;padding:9px 22px;font-size:17px;cursor:pointer;font-family:'Caveat',sans-serif;box-shadow:3px 3px 0 #333;transition:all .12s;color:#1a1a1a}
    .nav-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:4px 5px 0 #333}
    .nav-btn:active:not(:disabled){transform:translateY(1px);box-shadow:1px 2px 0 #333}
    .nav-btn:disabled{opacity:.35;cursor:default}
    .hint{font-size:12px;color:#888;text-align:center;margin-top:8px;font-family:'Noto Sans Thai',sans-serif}

    /* Month divider card */
    .month-divider{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:540px;text-align:center;gap:12px}
    .month-num{font-size:64px;line-height:1}
    .month-th{font-size:22px;font-family:'Noto Sans Thai',sans-serif;font-weight:700;color:#1a1a1a}
    .month-en{font-size:16px;color:#666;font-family:'Caveat',sans-serif}
    .month-topics{background:rgba(0,0,0,.06);border-radius:14px;padding:12px 18px;font-size:14px;font-family:'Noto Sans Thai',sans-serif;color:#333;line-height:1.8;text-align:left;width:100%}
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-title">🐼 Chengdu Cards</div>
  <div id="mbadge" class="month-badge">loading...</div>
</div>

<div class="prog-wrap">
  <div class="prog-bar-bg"><div class="prog-bar-fill" id="pbar" style="width:0%"></div></div>
  <div class="prog-text" id="ptext">-</div>
</div>

<div class="card" id="card"></div>

<div class="nav">
  <button class="nav-btn" id="prev" onclick="go(-1)">← ก่อน</button>
  <button class="nav-btn" id="next" onclick="go(1)">ถัดไป →</button>
</div>
<p class="hint">Batch 1 · 12 cards · พ.ค.–มิ.ย.</p>

<script>
const MONTHS = {
  1: { label:"เดือน 1 — พฤษภาคม", color:"#6BBFAD", icon:"🌱" },
  2: { label:"เดือน 2 — มิถุนายน", color:"#E8845A", icon:"🌶️" }
};

const cards = [
  // ===== MONTH DIVIDER 1 =====
  { type:"divider", month:1, topics:["ทักทาย / ขอบคุณ / ขอโทษ","ถามราคา","ห้องน้ำ (survival!)","อร่อย / ไม่อร่อย"] },

  // ===== MONTH 1 =====
  {
    month:1, word:"你好", py:"( nǐ  hǎo )", mean:"สวัสดี / หวัดดี",
    blob:"#7ECFC0", emoji:"👋", badge:"ทักทาย • พื้นฐาน",
    radicals:[
      { hl:"你", hc:"ho", py:"nǐ", mn:"คุณ",
        dt:"亻(คน) + 尔(เสียง) → คนที่อยู่ตรงหน้าฉัน = คุณ",
        sb:"亻 คือ radical 'คน' ย่อมาจาก 人 → พบในคำที่เกี่ยวกับคนเสมอ เช่น 他(เขา) 她(เธอ)" },
      { hl:"好", hc:"hg", py:"hǎo", mn:"ดี",
        dt:"女(ผู้หญิง) + 子(ลูก/เด็ก) → ผู้หญิงมีลูก = ความสุข = ดี",
        sb:"好 เจ๋งมาก! ใช้ได้หลายแบบ: 好吃(อร่อย) 好看(สวย) 好玩(สนุก)" }
    ],
    trick:"你好 = 'คุณ + ดี' → ทักทายด้วยการบอกว่า 'คุณดีนะ!' เหมือนฝรั่งพูด 'How are you?' แต่กระชับกว่า 😄",
    examples:[
      { zh:"你好！我是泰国人。", py:"(Nǐ hǎo! Wǒ shì Tàiguó rén.)", th:"สวัสดี! ฉันเป็นคนไทย" },
      { zh:"你好，请问厕所在哪？", py:"(Nǐ hǎo, qǐngwèn cèsuǒ zài nǎ?)", th:"สวัสดีค่ะ ขอถามว่าห้องน้ำอยู่ที่ไหนคะ?" }
    ]
  },
  {
    month:1, word:"谢谢", py:"( xiè  xie )", mean:"ขอบคุณ",
    blob:"#FFB347", emoji:"🙏", badge:"礼貌 มารยาท",
    radicals:[
      { hl:"谢", hc:"ho", py:"xiè", mn:"ขอบคุณ / ลาออก",
        dt:"讠(พูด) + 射(ยิง/ส่ง) → 'ยิงคำพูดออกไป' = ส่งคำขอบคุณออกไป",
        sb:"讠= 言 ย่อ = การพูด → คำที่เกี่ยวกับการสื่อสารมักมี radical นี้ เช่น 说(พูด) 请(ขอ)" }
    ],
    trick:"谢谢 พูดซ้ำ 2 ครั้ง! 🔁 เหมือนไทยที่พูดซ้ำเพื่อเน้น ถ้าขอบคุณมากๆ พูดว่า 非常谢谢 (fēicháng xièxie) = ขอบคุณมากๆๆ",

      { zh:"谢谢你！", py:"(Xièxie nǐ!)", th:"ขอบคุณมากนะ!" },
      { zh:"谢谢你的帮助。", py:"(Xièxie nǐ de bāngzhù.)", th:"ขอบคุณสำหรับความช่วยเหลือ" }
    ]
  },
  {
    month:1, word:"对不起", py:"( duì bu qǐ )", mean:"ขอโทษ",
    blob:"#FF8FAB", emoji:"😔", badge:"礼貌 มารยาท",
    radicals:[
      { hl:"对", hc:"ho", py:"duì", mn:"ถูก / ตรงกัน",
        dt:"เดิมมาจากรูปมือที่ถือตะเกียง → ชี้ให้ตรง → ถูกต้อง",
        sb:"对 ยังแปลว่า 'ใช่' เช่น 对！= ใช่! / 不对 = ไม่ใช่/ผิด" },
      { hl:"起", hc:"hg", py:"qǐ", mn:"ลุก / เริ่ม",

    trick:"对不起 = 'ถูก + ไม่ + ลุก' → ฉันผิดจนไม่กล้าเงยหน้าขึ้น = ขอโทษ! 🙈  คู่กับ: 没关系 (méi guānxi) = ไม่เป็นไร",
    examples:[
      { zh:"对不起！我来晚了。", py:"(Duìbuqǐ! Wǒ lái wǎn le.)", th:"ขอโทษ! ฉันมาสาย" },
      { zh:"对不起，我不会说中文。", py:"(Duìbuqǐ, wǒ bù huì shuō Zhōngwén.)", th:"ขอโทษ ฉันพูดจีนไม่ได้" }
    ]
  },
  {
    month:1, word:"多少钱", py:"( duō shao qián )", mean:"ราคาเท่าไหร่?",
    blob:"#FFD580", emoji:"💰", badge:"ช้อปปิ้ง • survival",
    radicals:[
      { hl:"多", hc:"ho", py:"duō", mn:"มาก",
        dt:"เดิมคือรูปเนื้อสองชิ้นซ้อนกัน 夕夕 → ของมากมาย = มาก",
        sb:"คู่กับ 少(shǎo) = น้อย → 多少 = มากน้อยเท่าไหร่" },
      { hl:"钱", hc:"hg", py:"qián", mn:"เงิน",
        dt:"钅(โลหะ) + 戋(เล็กน้อย) → โลหะชิ้นเล็กๆ = เหรียญ = เงิน",
        sb:"钅= 金 ย่อ = โลหะ → คำที่เกี่ยวกับเงิน/โลหะมักมี radical นี้" }
    ],
    trick:"多少钱 = 'มาก-น้อย + เงิน' → เงินนี้มากหรือน้อย? = ราคาเท่าไหร่! ถามก่อนซื้อทุกครั้ง 😤",
    extra:"ตอบ: X 块 (kuài) เช่น 50块 = 50 หยวน / ถูก = 便宜(piányí) / แพง = 贵(guì)",
    examples:[
      { zh:"这个多少钱？", py:"(Zhège duōshao qián?)", th:"อันนี้ราคาเท่าไหร่?" },

  },

    month:1, word:"好吃", py:"( hǎo chī )", mean:"อร่อย",
    blob:"#98D8A0", emoji:"😋", badge:"อาหาร • ทั่วไป",
    radicals:[

        dt:"(เหมือน 你好) 女 + 子 → ผู้หญิงมีลูก = ดี",
        sb:"好 + [คำกริยา] = ดีในเรื่องนั้น: 好看=สวย 好听=ไพเราะ 好玩=สนุก 好吃=อร่อย" },
      { hl:"吃", hc:"ho", py:"chī", mn:"กิน",
        dt:"口(ปาก) + 乞(ขอ/ขอทาน) → ปากที่ขออาหาร = กิน",
        sb:"口 = ปาก → คำที่เกี่ยวกับปาก/เสียง เช่น 喝(ดื่ม) 叫(ร้อง) 唱(ร้องเพลง)" }
    ],
    trick:"好吃 = 'ดี + กิน' → กินแล้วรู้สึกดี = อร่อย! ง่ายที่สุด ใช้บ่อยที่สุดที่เฉิงตู 🔥",

      { hl:"厕", hc:"ho", py:"cè", mn:"ส้วม",

      { hl:"所", hc:"hg", py:"suǒ", mn:"สถานที่",
        dt:"户(บ้าน) + 斤(ขวาน เสียง) → สถานที่, ที่อยู่",

  // ===== MONTH DIVIDER 2 =====

  {
    month:2, word:"麻辣", py:"( má là )", mean:"เผ็ดซ่า (Sichuan signature)",

      { hl:"麻", hc:"ho", py:"má", mn:"ชา / ซ่า",
        dt:"林(ต้นไม้) + 广(หลังคา) → ต้นกัญชงที่ปลูกในร่ม → เส้นใยพันกัน → ความรู้สึกซ่าชา",

      { hl:"辣", hc:"hg", py:"là", mn:"เผ็ด",
        dt:"(เหมือน 不要辣) 辛 + 束 → ถูกมัดด้วยความเผ็ด",

// ===================================================
let idx = 0;
const contentCards = cards; // all including dividers

function getMonthInfo(m){ return MONTHS[m] || {label:'—', color:'#888', icon:'📚'} }

function updateHeader(m){
  const info = getMonthInfo(m);
  const mb = document.getElementById('mbadge');
  mb.textContent = info.icon + ' ' + info.label;
  mb.style.background = info.color;
}

function updateProgress(){
  const total = contentCards.length;
  const pct = Math.round(((idx+1)/total)*100);
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('ptext').textContent = `${idx+1} / ${total}  (${pct}%)`;
}

function renderDivider(c){
  const info = getMonthInfo(c.month);
  const topicsHTML = c.topics.map(t=>`<div>• ${t}</div>`).join('');
  document.getElementById('card').innerHTML = `
    <div class="month-divider">
      <div class="month-num">${info.icon}</div>
      <div class="month-th">${info.label}</div>
      <div class="month-en">เดือนที่ ${c.month} ของ 5-month plan</div>
      <div class="month-topics"><b>คำที่จะเรียนเดือนนี้:</b><br>${topicsHTML}</div>
    </div>`;
  updateHeader(c.month);
}

function renderCard(c){
  const radicalsHTML = c.radicals.map(r=>`
    <div class="rad-row"><div>
      <span class="hl ${r.hc}">${r.hl}</span>
      <span style="font-size:12.5px;color:#777">(${r.py})</span>
      = ${r.mn} <span style="color:#777">→</span>
      <span style="font-size:13.5px">${r.dt}</span>
      ${r.sb?`<span class="sub">${r.sb}</span>`:''}
    </div></div>`).join('');

  const exHTML = c.examples.map(e=>`
    <div class="ex-item">
      <span class="zh-s">${e.zh}</span>
      <span class="py-s">${e.py}</span>
      <span class="th-s">= ${e.th}</span>
    </div>`).join('');

  document.getElementById('card').innerHTML = `
    <div class="card-top">
      <div class="word-section">
        <div><span class="cat-badge">${c.badge}</span></div>
        <div class="blob-wrap" style="--bc:${c.blob}">
          <div class="zh-main">${c.word}</div>
        </div>
        <div class="py-main">${c.py}</div>
        <div class="th-main">${c.mean}</div>
      </div>
      <div class="emoji-box">${c.emoji}</div>
    </div>
    <hr>
    <div class="sec-label">รากศัพท์ :</div>
    ${radicalsHTML}
    <div class="trick"><span class="tl">TRICK 💡 </span>${c.trick}</div>
    ${c.extra?`<div class="extra">${c.extra}</div>`:''}
    <div class="sec-label">Example :</div>
    ${exHTML}`;

  updateHeader(c.month);
}

function render(){
  const c = contentCards[idx];
  if(c.type==='divider') renderDivider(c);
  else renderCard(c);
  updateProgress();
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===contentCards.length-1;
}

function go(d){
  idx = Math.max(0, Math.min(contentCards.length-1, idx+d));
  render();
}

render();
</script>
