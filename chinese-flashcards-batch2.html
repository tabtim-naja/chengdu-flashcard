<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🐼 Chengdu Cards — Batch 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#ddd6c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Caveat','Noto Sans Thai',sans-serif;padding:16px}
    .app-header{text-align:center;margin-bottom:10px}
    .app-title{font-size:22px;color:#444;font-family:'Caveat',sans-serif}
    .month-badge{display:inline-block;padding:3px 16px;border-radius:20px;font-size:13px;font-family:'Noto Sans Thai',sans-serif;margin-top:4px;color:#fff}

    .prog-wrap{width:100%;max-width:460px;margin-bottom:12px}
    .prog-bar-bg{background:#c5bdb2;border-radius:20px;height:8px;width:100%;overflow:hidden}
    .prog-bar-fill{background:#555;border-radius:20px;height:8px;transition:width 0.35s ease}
    .prog-text{text-align:center;font-size:13px;color:#666;margin-top:4px;font-family:'Noto Sans Thai',sans-serif}

    .card{background:#f5f0e6;border-radius:28px;padding:24px 20px 20px;box-shadow:5px 8px 24px rgba(0,0,0,.15);width:100%;max-width:460px;min-height:540px;position:relative}

    .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
    .word-section{flex:1;text-align:center}
    .cat-badge{display:inline-block;background:#444;color:#f5f0e6;font-size:11px;padding:2px 12px;border-radius:20px;margin-bottom:6px;font-family:'Noto Sans Thai',sans-serif}
    .blob-wrap{position:relative;display:inline-block;padding:6px 16px 10px;margin-bottom:2px}
    .blob-wrap::before{content:'';position:absolute;inset:0;background:var(--bc,#7ECFC0);border-radius:58% 62% 55% 68%/60% 55% 65% 58%;z-index:0}
    .zh-main{font-family:'Noto Sans SC',sans-serif;font-size:54px;font-weight:900;color:#1a1a1a;position:relative;z-index:1;line-height:1.05;letter-spacing:4px}
    .py-main{font-size:17px;color:#555;margin-top:4px;font-family:'Caveat',sans-serif;letter-spacing:1px}
    .th-main{font-size:20px;font-weight:700;color:#222;margin-top:2px;font-family:'Noto Sans Thai',sans-serif}
    .emoji-box{font-size:52px;line-height:1;padding-left:8px;padding-top:4px;flex-shrink:0}

    hr{border:none;border-top:1.5px solid #ccc;margin:10px 0}
    .sec-label{font-size:18px;font-weight:700;color:#1a1a1a;font-family:'Caveat',sans-serif;display:inline-block;border-bottom:2.5px wavy #888;padding-bottom:1px;margin-bottom:10px}

    .rad-row{display:flex;align-items:flex-start;margin-bottom:9px;font-size:14.5px;line-height:1.55;color:#2a2a2a}
    .rad-row::before{content:'– ';flex-shrink:0;margin-top:1px}
    .hl{display:inline-block;padding:0 10px 1px;border-radius:50px;font-family:'Noto Sans SC',sans-serif;font-weight:700;font-size:18px;vertical-align:middle;margin-right:2px}
    .ho{background:#FFD580}.hg{background:#A8E6C8}.hb{background:#B3D8FF}.hp{background:#FFB8C6}.hv{background:#D4B8FF}
    .sub{display:block;margin-left:20px;font-size:13px;color:#666;line-height:1.4;margin-top:2px}
    .sub::before{content:'↳ '}

    .trick{background:#FFD580;border-radius:14px;padding:10px 14px;margin:10px 0 8px;font-size:14.5px;line-height:1.55;color:#1a1a1a}
    .tl{font-weight:700;font-size:16px;font-family:'Caveat',sans-serif}

    .extra{background:#e8f4fd;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:#2a5f8f;line-height:1.5}
    .extra::before{content:'📌 '}

    .pair-box{background:#f0ffe8;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:#2a6e2a;line-height:1.6;font-family:'Noto Sans Thai',sans-serif}
    .pair-box::before{content:'🔗 คู่กับ: '}

    .ex-item{margin-bottom:10px;font-size:14.5px;line-height:1.5}
    .ex-item::before{content:'– '}
    .zh-s{font-family:'Noto Sans SC',sans-serif;font-weight:700;font-size:16px;color:#1a1a1a}
    .py-s{display:block;margin-left:12px;font-size:12px;color:#777}
    .th-s{display:block;margin-left:12px;font-size:13.5px;color:#c0392b;font-family:'Noto Sans Thai',sans-serif}

    .nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;width:100%;max-width:460px;gap:10px}
    .nav-btn{background:#f5f0e6;border:2.5px solid #333;border-radius:50px;padding:9px 22px;font-size:17px;cursor:pointer;font-family:'Caveat',sans-serif;box-shadow:3px 3px 0 #333;transition:all .12s;color:#1a1a1a}
    .nav-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:4px 5px 0 #333}
    .nav-btn:active:not(:disabled){transform:translateY(1px);box-shadow:1px 2px 0 #333}
    .nav-btn:disabled{opacity:.35;cursor:default}

    .bottom-nav{display:flex;justify-content:center;gap:12px;margin-top:10px;width:100%;max-width:460px}
    .home-btn{background:#1a1a1a;color:#f5f0e6;border:none;border-radius:50px;padding:8px 20px;font-size:15px;cursor:pointer;font-family:'Caveat',sans-serif;text-decoration:none;display:inline-block}

    .hint{font-size:12px;color:#888;text-align:center;margin-top:8px;font-family:'Noto Sans Thai',sans-serif}

    .month-divider{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:540px;text-align:center;gap:12px}
    .month-icon{font-size:64px;line-height:1}
    .month-th{font-size:22px;font-family:'Noto Sans Thai',sans-serif;font-weight:700;color:#1a1a1a}
    .month-en{font-size:16px;color:#666;font-family:'Caveat',sans-serif}
    .month-topics{background:rgba(0,0,0,.06);border-radius:14px;padding:12px 18px;font-size:14px;font-family:'Noto Sans Thai',sans-serif;color:#333;line-height:1.8;text-align:left;width:100%}
    .recap-box{background:#6BBFAD;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-family:'Noto Sans Thai',sans-serif;line-height:1.6;width:100%}
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-title">🐼 Chengdu Cards</div>
  <div id="mbadge" class="month-badge" style="background:#6BBFAD">🌱 เดือน 1 — พฤษภาคม (ต่อ)</div>
</div>

<div class="prog-wrap">
  <div class="prog-bar-bg"><div class="prog-bar-fill" id="pbar"></div></div>
  <div class="prog-text" id="ptext"></div>
</div>

<div class="card" id="card"></div>

<div class="nav">
  <button class="nav-btn" id="prev" onclick="go(-1)">← ก่อน</button>
  <button class="nav-btn" id="next" onclick="go(1)">ถัดไป →</button>
</div>
<div class="bottom-nav">
  <a href="index.html" class="home-btn">🏠 กลับหน้าหลัก</a>
</div>
<p class="hint">Batch 2 · 14 cards · เดือน 1 ต่อ (พ.ค.) · Session 2</p>

<script>
const cards = [
  // DIVIDER
  {
    type:"divider",
    topics:["ตอบรับ / ปฏิเสธสุภาพ","ขอความช่วยเหลือ","บอกที่มาของตัวเอง","ถามเวลาและทิศทาง","ตัวเลขพื้นฐาน"],
    recap:"✅ Batch 1 เรียนไปแล้ว: 你好 谢谢 对不起 多少钱 好吃 厕所 不要辣 麻辣 熊猫 火锅 地铁 扫码"
  },

  // 1
  {
    word:"没关系", py:"( méi  guān xi )", mean:"ไม่เป็นไร / No problem",
    blob:"#98D8A0", emoji:"😌", badge:"礼貌 มารยาท",
    radicals:[
      { hl:"没", hc:"ho", py:"méi", mn:"ไม่มี / ไม่ได้",
        dt:"氵(น้ำ) + 殳(เสียง) → น้ำที่ไหลหายไปจนไม่เหลือ = ไม่มี",
        sb:"没 ใช้ 2 แบบ: 没有(ไม่มี) และ 没+กริยา = ยังไม่ได้ทำ เช่น 没吃(ยังไม่ได้กิน)" },
      { hl:"关系", hc:"hg", py:"guān xi", mn:"ความสัมพันธ์",
        dt:"关=ปิด/เชื่อม + 系=ผูก → ผูกพันเชื่อมกัน = ความสัมพันธ์",
        sb:"没关系 = ไม่มีความสัมพันธ์(กับเรื่องนั้น) → ไม่เป็นไร!" }
    ],
    trick:"没关系 = 'ไม่มี + ความสัมพันธ์' → เรื่องนั้นไม่เกี่ยวกับฉัน = ไม่เป็นไร! 😌 ใช้ตอบ 对不起 เสมอ",
    pair:"对不起 (ขอโทษ) → 没关系 (ไม่เป็นไร) ✅ คู่คลาสสิกที่ต้องจำคู่กัน",
    examples:[
      { zh:"对不起！— 没关系，没事的。", py:"(Duìbuqǐ! — Méi guānxi, méi shì de.)", th:"ขอโทษ! — ไม่เป็นไร ไม่มีอะไรหรอก" },
      { zh:"你帮了我很多，没关系吗？", py:"(Nǐ bāng le wǒ hěn duō, méi guānxi ma?)", th:"คุณช่วยฉันเยอะมาก ไม่เป็นไรนะคะ?" }
    ]
  },

  // 2
  {
    word:"请", py:"( qǐng )", mean:"กรุณา / ขอ / เชิญ",
    blob:"#FFD580", emoji:"🙏", badge:"礼貌 มารยาท",
    radicals:[
      { hl:"请", hc:"ho", py:"qǐng", mn:"กรุณา / เชิญ",
        dt:"讠(พูด) + 青(สีเขียวสด เสียง qīng) → พูดด้วยน้ำเสียงสดใส/สุภาพ = กรุณา",
        sb:"讠= 言 ย่อ = การพูด → 请 เป็นคำพูดที่สุภาพที่สุด ใช้นำหน้าคำขอทุกประเภท" }
    ],
    trick:"请 มี radical 讠(พูด) → ใช้ทุกครั้งที่พูดขอร้องสุภาพๆ เหมือน 'Please' ในภาษาอังกฤษ! ใส่ไว้หน้าประโยคได้เลย",
    extra:"请 ใช้ได้หลายแบบ: 请坐(นั่งได้เลย) 请进(เข้ามาได้เลย) 请问(ขอถาม) 请等一下(รอแป๊บนึงนะ)",
    examples:[
      { zh:"请给我一杯水。", py:"(Qǐng gěi wǒ yī bēi shuǐ.)", th:"กรุณาเอาน้ำมาให้ฉันแก้วหนึ่งค่ะ" },
      { zh:"请慢走！", py:"(Qǐng màn zǒu!)", th:"ค่อยๆ เดินนะคะ! (คำลาแขก = เชิญกลับได้นะ)" }
    ]
  },

  // 3
  {
    word:"再见", py:"( zài jiàn )", mean:"ลาก่อน / แล้วเจอกัน",
    blob:"#FFB347", emoji:"👋", badge:"ทักทาย",
    radicals:[
      { hl:"再", hc:"ho", py:"zài", mn:"อีกครั้ง",
        dt:"เดิมมาจากรูปปลาที่กลับมา → สิ่งที่เกิดขึ้นซ้ำ = อีกครั้ง",
        sb:"再 ใช้บ่อยมาก: 再来一碗(ขออีกชาม) 再说一次(พูดอีกที) 再见(แล้วเจอกัน)" },
      { hl:"见", hc:"hg", py:"jiàn", mn:"เห็น / พบ",
        dt:"เดิมคือรูปตาที่มองอยู่ 👁 → การมองเห็น = พบเจอ",
        sb:"见 พบบ่อย: 见面(พบหน้า) 见到(พบเจอ) 意见(ความเห็น)" }
    ],
    trick:"再见 = 'อีกครั้ง + เห็น' → แล้วเจอกันใหม่อีกครั้ง! 👋 ใช้แทน Goodbye ได้ทุกสถานการณ์",
    extra:"ลาแบบอื่น: 拜拜(bái bái = bye bye) 回头见(huí tóu jiàn = แล้วเจอกัน แบบ casual) 保重(bǎozhòng = ดูแลตัวด้วยนะ)",
    examples:[
      { zh:"谢谢你！再见！", py:"(Xièxie nǐ! Zàijiàn!)", th:"ขอบคุณมากนะคะ! ลาก่อน!" },
      { zh:"明天见！", py:"(Míngtiān jiàn!)", th:"แล้วเจอกันพรุ่งนี้!" }
    ]
  },

  // 4
  {
    word:"请问", py:"( qǐng wèn )", mean:"ขอถามว่า / Excuse me (ก่อนถาม)",
    blob:"#B3D8FF", emoji:"🙋", badge:"สื่อสาร • ใช้บ่อยสุด",
    radicals:[
      { hl:"请", hc:"ho", py:"qǐng", mn:"กรุณา",
        dt:"(เหมือน card ก่อน) 讠+青 → พูดสุภาพ",
        sb:"ใส่ 请 นำหน้า 问 → ขอถามอย่างสุภาพ" },
      { hl:"问", hc:"hg", py:"wèn", mn:"ถาม",
        dt:"口(ปาก) + 门(ประตู) → ปากที่เคาะประตูเพื่อถาม",
        sb:"口=ปาก + 门=ประตู → เหมือนเดินไปเคาะประตูบ้านใครเพื่อถามทาง 🚪" }
    ],
    trick:"请问 = 'กรุณา + ถาม' → ขอถามหน่อยนะ! เหมือน 'Excuse me' ภาษาอังกฤษ ใช้นำหน้าทุกครั้งก่อนถามทาง ถามราคา หรือถามอะไรก็ตาม",
    extra:"ใช้ได้กับทุกประโยคคำถาม: 请问+[คำถาม] → สุภาพขึ้นทันที!\n请问厕所在哪里？/ 请问多少钱？/ 请问怎么去...？",
    examples:[
      { zh:"请问，附近有便利店吗？", py:"(Qǐngwèn, fùjìn yǒu biànlìdiàn ma?)", th:"ขอถามว่า แถวนี้มีร้านสะดวกซื้อไหมครับ?" },
      { zh:"请问，去武侯祠怎么走？", py:"(Qǐngwèn, qù Wǔhóu Cí zěnme zǒu?)", th:"ขอถามว่า ไปวัดอู่โหวยังไงครับ?" }
    ]
  },

  // 5
  {
    word:"听不懂", py:"( tīng bù dǒng )", mean:"ฟังแล้วไม่เข้าใจ",
    blob:"#FFB8C6", emoji:"😵", badge:"สื่อสาร • survival",
    radicals:[
      { hl:"听", hc:"ho", py:"tīng", mn:"ฟัง",
        dt:"口(ปาก) + 斤(ขวาน เสียง) → ฟังอย่างตั้งใจเหมือนโดนขวานฟัน!",
        sb:"听 ยังใช้ใน: 好听(ไพเราะ) 听说(ได้ยินว่า) 听音乐(ฟังเพลง)" },
      { hl:"懂", hc:"hg", py:"dǒng", mn:"เข้าใจ",
        dt:"忄(ใจ) + 童(เด็ก เสียง) → ใจที่รับรู้ได้ = เข้าใจ",
        sb:"คู่กับ: 看懂(อ่านแล้วเข้าใจ) 听懂(ฟังแล้วเข้าใจ) 说懂(พูดให้เข้าใจ)" }
    ],
    trick:"听不懂 = 'ฟัง + ไม่ + เข้าใจ' → ฟังแล้วแต่ยังไม่เข้าใจ! 😵 พูดประโยคนี้ได้เลยเวลาจีนพูดเร็วเกินไป คนจีนจะช่วยพูดช้าลงให้",
    pair:"听不懂(ไม่เข้าใจ) ↔ 听懂了(เข้าใจแล้ว!) · 看不懂(อ่านไม่ออก) ↔ 看懂了(อ่านออกแล้ว!)",
    examples:[
      { zh:"对不起，我听不懂，你能说慢一点吗？", py:"(Duìbuqǐ, wǒ tīng bù dǒng, nǐ néng shuō màn yīdiǎn ma?)", th:"ขอโทษ ฉันไม่เข้าใจ พูดช้าลงหน่อยได้ไหมครับ?" },
      { zh:"我的中文不好，我听不懂。", py:"(Wǒ de Zhōngwén bù hǎo, wǒ tīng bù dǒng.)", th:"ภาษาจีนของฉันไม่ดี ฉันฟังไม่เข้าใจ" }
    ]
  },

  // 6
  {
    word:"再说一次", py:"( zài shuō yī cì )", mean:"พูดอีกครั้งได้ไหม?",
    blob:"#D4B8FF", emoji:"🔁", badge:"สื่อสาร • survival",
    radicals:[
      { hl:"再", hc:"ho", py:"zài", mn:"อีกครั้ง",
        dt:"(เหมือน 再见) → สิ่งที่เกิดซ้ำ",
        sb:"再 = อีก → ใช้ขอให้ทำซ้ำได้เลย" },
      { hl:"说", hc:"hg", py:"shuō", mn:"พูด",
        dt:"讠(พูด) + 兑(แลกเปลี่ยน) → พูดเพื่อแลกเปลี่ยนความคิด",
        sb:"说 พบบ่อย: 说话(พูดคุย) 说中文(พูดจีน) 听说(ได้ยินว่า)" },
      { hl:"一次", hc:"hb", py:"yī cì", mn:"หนึ่งครั้ง",
        dt:"一=หนึ่ง + 次=ครั้ง → หนึ่งครั้ง",
        sb:"次 ใช้นับครั้ง: 两次(สองครั้ง) 几次(กี่ครั้ง) 每次(ทุกครั้ง)" }
    ],
    trick:"再说一次 = 'อีก + พูด + หนึ่งครั้ง' → ช่วยพูดอีกครั้งได้ไหม! 🔁 ท่อง 3 คำนี้ไว้ใช้งานได้ทันทีที่ไม่เข้าใจ",
    extra:"ใช้คู่กับ: 慢一点(màn yīdiǎn = ช้าลงหน่อย) เช่น 请再说一次，慢一点！= พูดอีกทีช้าๆ ได้ไหมครับ?",
    examples:[
      { zh:"请再说一次，好吗？", py:"(Qǐng zài shuō yīcì, hǎo ma?)", th:"ช่วยพูดอีกครั้งได้ไหมครับ?" },
      { zh:"对不起，请再说一次，慢一点。", py:"(Duìbuqǐ, qǐng zài shuō yīcì, màn yīdiǎn.)", th:"ขอโทษ ช่วยพูดอีกทีช้าๆ หน่อยได้ไหมครับ?" }
    ]
  },

  // 7
  {
    word:"帮帮我", py:"( bāng bāng wǒ )", mean:"ช่วยด้วย! / Help me!",
    blob:"#FF8FAB", emoji:"🆘", badge:"🚨 ฉุกเฉิน",
    radicals:[
      { hl:"帮", hc:"ho", py:"bāng", mn:"ช่วย / สนับสนุน",
        dt:"邦(รัฐ/กลุ่ม) + 巾(ผ้า) → กลุ่มคนที่ผูกพันกันช่วยเหลือกัน",

let idx = 0;

function updateProgress(){
  const pct = Math.round(((idx+1)/cards.length)*100);
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('ptext').textContent = `${idx+1} / ${cards.length}  (${pct}%)  ·  Session 2 of 5-month plan`;
}

function renderDivider(c){
  const topicsHTML = c.topics.map(t=>`<div>• ${t}</div>`).join('');
  document.getElementById('card').innerHTML = `
    <div class="month-divider">
      <div class="month-icon">🌱</div>
      <div class="month-th">เดือน 1 — พฤษภาคม (ต่อ)</div>
      <div class="month-en">Session 2 · 14 cards เพิ่มเติม</div>
      <div class="recap-box">${c.recap}</div>
      <div class="month-topics"><b>Session นี้จะเรียน:</b><br>${topicsHTML}</div>
    </div>`;
}

function renderCard(c){
  const radsHTML = c.radicals.map(r=>`
    <div class="rad-row"><div>
      <span class="hl ${r.hc}">${r.hl}</span>
      <span style="font-size:12.5px;color:#777">(${r.py})</span>
      = ${r.mn} <span style="color:#777">→</span>
      <span style="font-size:13.5px">${r.dt}</span>
      ${r.sb?`<span class="sub">${r.sb}</span>`:''}
    </div></div>`).join('');

  const exHTML = c.examples.map(e=>`
    <div class="ex-item">
      <span class="zh-s">${e.zh}</span>
      <span class="py-s">${e.py}</span>
      <span class="th-s">= ${e.th}</span>
    </div>`).join('');

  document.getElementById('card').innerHTML = `
    <div class="card-top">
      <div class="word-section">
        <div><span class="cat-badge">${c.badge}</span></div>
        <div class="blob-wrap" style="--bc:${c.blob}">
          <div class="zh-main">${c.word}</div>
        </div>
        <div class="py-main">${c.py}</div>
        <div class="th-main">${c.mean}</div>
      </div>
      <div class="emoji-box">${c.emoji}</div>
    </div>
    <hr>
    <div class="sec-label">รากศัพท์ :</div>
    ${radsHTML}
    <div class="trick"><span class="tl">TRICK 💡 </span>${c.trick}</div>
    ${c.extra?`<div class="extra">${c.extra}</div>`:''}
    ${c.pair?`<div class="pair-box">${c.pair}</div>`:''}
    <div class="sec-label">Example :</div>
    ${exHTML}`;
}

function render(){
  const c = cards[idx];
  if(c.type==='divider') renderDivider(c); else renderCard(c);
  updateProgress();
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===cards.length-1;
}

function go(d){
  idx = Math.max(0, Math.min(cards.length-1, idx+d));
  render();
}

render();
</script>
